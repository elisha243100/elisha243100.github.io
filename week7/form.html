<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="css/form.css">
</head>

<body>
    <div class="container">
        <h2>Registration form</h2>
        <form action="/action_page.php">
            <div class="information">
                <div class="first name">
                    <label for="fname">First name:*</label><br>
                    <input type="text" id="fname" name="fname" placeholder="Name" required>
                </div>
                <div class="last name">
                    <label for="lname">Last name:*</label><br>
                    <input type="text" id="lname" name="lname" placeholder="Surname" required><br>
                </div>
                <div class="dob">
                    <label for="dob">Date of Birth:*</label><br>
                    <input type="date" id="dob" name="Date of Birth" placeholder="Date of Birth" required>
                </div>
                <div class="email">
                    <label for="email">Email:*</label><br>
                    <input type="email" id="email" name="email" placeholder="m01@example.com" required>
                </div>
            </div>

            <div class="homepage">
                <label for="homepage">Homepage url:</label>
                <input type="url" id="homepage" name="homepage" placeholder="www.example.com">
            </div>

            <div class="favoritecolor">
                <p>Favorite color:</p>
                <input type="checkbox" id="color1" name="color1" value="red">
                <label for="color1"> red</label><br>
                <input type="checkbox" id="color2" name="color2" value="orange">
                <label for="color2"> orange</label><br>
                <input type="checkbox" id="color3" name="color3" value="yellow">
                <label for="color3"> yellow</label><br>
                <input type="checkbox" id="color4" name="color4" value="green">
                <label for="color4"> green</label><br>
                <input type="checkbox" id="color5" name="color5" value="blue">
                <label for="color5"> blue</label><br>
                <input type="checkbox" id="color6" name="color6" value="purple">
                <label for="color6"> purple</label><br>
                <input type="text" id="ocolors" name="ocolors" placeholder="Others:">
            </div>
            <div class="bio"><br>
                <label for="bio">Write a short self-introduction:</label><br>
                <textarea id="bio" name="bio" rows="10" cols="100">
                </textarea>
            </div>
            <input type="submit" value="Submit">

        </form>
    </div>
</body>

</html>
